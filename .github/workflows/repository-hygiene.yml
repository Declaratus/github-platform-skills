name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  generated-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the proposed tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Reject tracked run output
        run: python3 build/check_repository_hygiene.py
      - name: Test the artifact guard
        run: python3 -m unittest discover -s build/tests -p test_repository_hygiene.py -v
